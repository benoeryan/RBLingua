[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@google/genai"]

[[redirects]]
  from = "/api/translate"
  to = "/.netlify/functions/translate"
  status = 200

[[redirects]]
  from = "/api/ocr-scan"
  to = "/.netlify/functions/ocr-scan"
  status = 200

[[redirects]]
  from = "/api/summarize-meeting"
  to = "/.netlify/functions/summarize-meeting"
  status = 200

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
